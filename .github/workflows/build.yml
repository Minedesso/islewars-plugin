name: Build Plugin JAR

on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp clean verify

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: islewars-plugin
          path: target/islewars-plugin-*.jar
          retention-days: 30
          if-no-files-found: error

  notify-infrastructure:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Request Minecraft image build and deployment
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo 'Missing INFRA_DISPATCH_TOKEN'; exit 1; }
          gh api --method POST repos/Minedesso/minedesso-infra/dispatches \
            -f event_type=plugin-updated
